  /* dragging a row by its ⠿ handle */

  var dragTitle = null;      // id of the row being carried

  function gripDown(t) {
    return function (e) {
      if (e.button > 0) return;
      if (e.target.closest("input, select, button")) return;   // let controls be
      e.preventDefault();

      dragTitle = t.id;
      var grip = e.currentTarget;
      grip.setPointerCapture(e.pointerId);
      document.body.classList.add("row-dragging");
      renderTitlesMenu();

      function move(ev) {
        var under = document.elementFromPoint(ev.clientX, ev.clientY);
        if (!under) return;

        var overRow = under.closest ? under.closest(".menu-row") : null;
        var overHead = under.closest ? under.closest(".menu-section") : null;

        if (overRow && overRow.dataset.title && overRow.dataset.title !== t.id) {
          dropOnto(t, titleById(overRow.dataset.title));
        } else if (overHead && overHead.dataset.section) {
          dropIntoSection(t, overHead.dataset.section);
        }
      }

      function up(ev) {
        grip.removeEventListener("pointermove", move);
        grip.removeEventListener("pointerup", up);
        grip.removeEventListener("pointercancel", up);
        try { grip.releasePointerCapture(ev.pointerId); } catch (err) {}

        dragTitle = null;
        document.body.classList.remove("row-dragging");
        save();
        renderWeek();
      }

      grip.addEventListener("pointermove", move);
      grip.addEventListener("pointerup", up);
      grip.addEventListener("pointercancel", up);
    };
  }

  // Put the carried title where the one under the pointer sits, taking that
  // one's section with it.
  function dropOnto(t, target) {
    if (!target || t === target) return;
    var from = data.titles.indexOf(t);
    var to = data.titles.indexOf(target);
    if (from < 0 || to < 0) return;

    t.group = target.group;
    data.titles.splice(from, 1);
    data.titles.splice(data.titles.indexOf(target) + (from < to ? 1 : 0), 0, t);
    renderTitlesMenu();
  }

  function dropIntoSection(t, section) {
    if (t.group === section) return;
    t.group = section;

    // land at the top of that section
    var idx = data.titles.findIndex(function (x) { return x !== t && x.group === section; });
    data.titles.splice(data.titles.indexOf(t), 1);
    data.titles.splice(idx < 0 ? data.titles.length : idx, 0, t);
    renderTitlesMenu();
  }

  function titleEditRow(t) {
    var row = document.createElement("div");
    row.className = "menu-row editing";

    var emo = document.createElement("input");
    emo.type = "text";
    emo.className = "t-emoji";
    emo.value = t.img ? "🖼️" : t.emoji;
    emo.maxLength = 4;
    emo.disabled = !!t.img;              // a picture is changed through Icon…
    emo.title = "Emoji";

    var nm = document.createElement("input");
    nm.type = "text";
    nm.className = "t-name";
    nm.value = t.name;
    nm.maxLength = 40;

    function commit() {
      var v = nm.value.trim();
      if (!v) { nm.focus(); return; }
      t.name = v;
      t.group = sel.value;
      if (!t.img) t.emoji = emo.value.trim() || t.emoji;
      titleEditing = null;
      save();
      renderWeek();
    }

    function cancel() { titleEditing = null; renderTitlesMenu(); }

    [emo, nm].forEach(function (f) {
      f.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); commit(); }
        else if (e.key === "Escape") { e.preventDefault(); cancel(); }
      });
    });

    var ok = document.createElement("button");
    ok.type = "button";
    ok.className = "t-btn save";
    ok.textContent = "Save";
    ok.addEventListener("click", commit);

    var no = document.createElement("button");
    no.type = "button";
    no.className = "t-btn";
    no.textContent = "Cancel";
    no.addEventListener("click", cancel);

    row.appendChild(emo); row.appendChild(nm); row.appendChild(ok); row.appendChild(no);

    var sel = document.createElement("select");
    sel.className = "t-group";
    sel.title = "Section";
    SECTIONS.forEach(function (s) {
      var o = document.createElement("option");
      o.value = s; o.textContent = s;
      if (t.group === s) o.selected = true;
      sel.appendChild(o);
    });
    row.appendChild(sel);

    var iconBtn = document.createElement("button");
    iconBtn.type = "button";
    iconBtn.className = "t-btn";
    iconBtn.textContent = "Icon…";
    iconBtn.title = "Choose an emoji or upload a picture";
    iconBtn.addEventListener("click", function () {
      titleEditing = null;
      picking = t.id;
      renderDay();
      pick.wrap.scrollIntoView({ block: "nearest" });
    });
    row.appendChild(iconBtn);

    return row;
  }

  // Undo any dragging: the standard titles go back to their original sections
  // and order, and titles you added yourself follow at the end. Two taps, since
  // it throws away the arrangement.
  var resetArmed = false;

  day.reset.addEventListener("click", function () {
    if (!resetArmed) {
      resetArmed = true;
      day.reset.textContent = "Tap again to put them back";
      day.reset.classList.add("armed");
      return;
    }

    var order = {}, groups = {};
    seedTitles().forEach(function (std, i) { order[std.id] = i; groups[std.id] = std.group; });

    data.titles.forEach(function (t) {
      if (t.stock && groups[t.id]) t.group = groups[t.id];
    });
    data.titles.sort(function (a, b) {
      var ai = a.id in order ? order[a.id] : 1000;
      var bi = b.id in order ? order[b.id] : 1000;
      return ai - bi;
    });

    resetArmed = false;
    day.reset.textContent = "Put titles back as they were";
    day.reset.classList.remove("armed");
    save();
    renderWeek();
  });

  day.restore.addEventListener("click", function () {
    seedTitles().forEach(function (std) {
      var here = data.titles.some(function (t) { return t.id === std.id; });
      if (!here) data.titles.push(std);
    });
    // put them back in the standard order, custom ones after
    data.titles.sort(function (a, b) {
      var ai = a.stock ? parseInt(a.id.slice(1), 10) : 1000;
      var bi = b.stock ? parseInt(b.id.slice(1), 10) : 1000;
      return ai - bi;
    });
    save();
    renderWeek();
  });

  day.btn.addEventListener("click", function () {
    menuOpen = !menuOpen;
    renderDay();
  });

  function addTitle() {
    var v = day.newTitle.value.trim();
    if (!v) { day.newTitle.focus(); return; }
    var dup = data.titles.some(function (t) { return t.name.toLowerCase() === v.toLowerCase(); });
    if (dup) { day.newTitle.select(); return; }

    var fresh = { id: "c" + uid(), name: v, emoji: "⭐", group: "Other", on: true, stock: false };
    data.titles.push(fresh);
    day.newTitle.value = "";
    save();

    // A new title lands with a placeholder star, so the icon picker opens
    // straight away for the parent to choose the real one.
    titleEditing = null;
    titleArmed = null;
    picking = fresh.id;
    renderWeek();
    pick.wrap.scrollIntoView({ block: "nearest" });
  }

  day.addTitle.addEventListener("click", addTitle);
  day.newTitle.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addTitle(); }
  });

  // A target of nothing makes no sense, so anything below 1 is pulled back up.
  function saveTarget(commit) {
    var kid = shownKid();
    if (!kid) return;

    var n = parseInt(week.rewardTarget.value, 10);
    if (!(n >= 1)) {
      if (!commit) return;              // let them finish typing first
      n = 1;
    }
    n = Math.max(1, Math.round(n));

    data.reward[kid.id] = n;
    save();
    if (commit) week.rewardTarget.value = n;
    renderWeek();
  }

  week.rewardTarget.addEventListener("input", function () { saveTarget(false); });
  week.rewardTarget.addEventListener("change", function () { saveTarget(true); });
  week.rewardTarget.addEventListener("blur", function () { saveTarget(true); });

  week.picker.addEventListener("change", function () {
    if (!week.picker.value) return;
    shownMonday = fromYmd(week.picker.value);
    renderWeek();
  });

  week.current.addEventListener("click", function () {
    shownMonday = thisMonday;
    renderWeek();
  });

  /* ---------- adding ---------- */

  KINDS.forEach(function (kind) {
    var ui = el[kind];

    function add() {
      if (editing && editing.kind === kind) return;   // belt and braces
      var v = ui.input.value.trim();
      if (!v) { ui.input.focus(); return; }
      if (taken(kind, v)) {
        setNote(kind, "There is already a " + wordFor[kind] + " called " + v + ".", true);
        render();
        ui.input.focus();
        return;
      }
      data[kind].push({ id: uid(), name: v });
      ui.input.value = "";
      arming = null;
      adding = null;       // closes again until "+" is pressed once more
      setNote(kind, null);
      save();
      render();
    }

    // The "+" beside the title opens the field; pressing it again closes it.
    ui.add.addEventListener("click", function () {
      if (adding === kind) {
        adding = null;
      } else {
        adding = kind;
        arming = null;
        clearEdit();
      }
      setNote(kind, null);
      render();
    });

    ui.ok.addEventListener("click", add);
    ui.input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); add(); }
      else if (e.key === "Escape") { e.preventDefault(); adding = null; setNote(kind, null); render(); }
    });
    ui.input.addEventListener("input", function () {
      if (notes[kind]) { setNote(kind, null); render(); ui.input.focus(); }
    });
  });

  /* ---------- backup ---------- */

  // The browser keeps its storage separately for every address a page is opened
  // from, so this is how a jar moves between the file, localhost and a phone.
  var backupNote = document.getElementById("backupNote");

  function say(text, warn) {
    backupNote.textContent = text || "";
    backupNote.className = "bk-note" + (warn ? " warn" : "");
  }

  document.getElementById("backupBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "point-jar-" + ymd(new Date()) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    say("Backup saved to your Downloads folder.");
  });

  document.getElementById("restoreFile").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      var loaded;
      try { loaded = JSON.parse(reader.result); } catch (err) { loaded = null; }

      if (!loaded || !Array.isArray(loaded.parents) || !Array.isArray(loaded.kids)) {
        say("That file is not a Point Jar backup.", true);
        return;
      }

      data = loaded;
      if (!data.points) data.points = {};
      if (!data.marks) data.marks = {};
      if (!data.more) data.more = {};
      if (!data.redLine) data.redLine = {};
      if (!data.strikes) data.strikes = {};
      if (!data.reward) data.reward = {};
      if (!Array.isArray(data.titles) || !data.titles.length) data.titles = seedTitles();
      fixGroups(data.titles);
      if (!data.startedOn) data.startedOn = ymd(new Date());

      KINDS.forEach(function (kind) { setActive(kind, null); });   // ask again
      save();
      render();
      renderWeek();
      say("Restored " + data.parents.length + " parents, " + data.kids.length + " kids.");
    };
    reader.readAsText(file);
  });

  // Once installed, the app carries its own copy of these files and opens with
  // no internet at all. (Ignored when opened straight from a file:// path.)
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }

  var weekReady = true;
  render();
  renderWeek();
})();
</script>
</body>
</html>
